services:
  api:
    image: todo-backend:${CI_COMMIT_SHORT_SHA}
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    environment:
      - APP_VERSION=${CI_COMMIT_SHORT_SHA}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
